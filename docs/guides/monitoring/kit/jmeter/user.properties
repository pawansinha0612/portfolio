# Copy these lines into JMeter's bin/user.properties, or pass the file with -q jmeter/user.properties.
# timed: percentiles for successful (statut=ok) and failed (statut=ko) samples cover one send interval.
# (The statut=all percentiles always use a sliding window of the last backend_metrics_window samples.)
backend_metrics_window_mode=timed
# Seconds between writes to InfluxDB. The JMeter dashboard assumes 5.
backend_influxdb.send_interval=5
