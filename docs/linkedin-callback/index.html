<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn sign-in — Pawan Sinha</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .cb { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .cb > div { max-width: 560px; width: 100%; }
    .cb h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 12px; }
    .cb p, .cb li { color: var(--muted); font-size: 17px; }
    .cb .code { font: 500 14px "JetBrains Mono", monospace; word-break: break-all; background: var(--card, rgba(127,127,127,.1));
      border: 1px solid rgba(127,127,127,.25); border-radius: 10px; padding: 14px; margin: 16px 0; color: inherit; }
    .cb .row { display: flex; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="cb"><div id="out">
    <h1>LinkedIn sign-in</h1>
    <p>This page is used to connect the blog to LinkedIn. Start from GitHub → Actions → <b>LinkedIn token</b>.</p>
  </div></main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search), out = document.getElementById('out');
      var run = 'https://github.com/pawansinha0612/portfolio/actions/workflows/linkedin-token.yml';
      history.replaceState(null, '', location.pathname); // keep the code out of the history and address bar
      var code = q.get('code'), err = q.get('error');
      if (err) {
        out.innerHTML = '<h1>LinkedIn said no</h1><p></p><a class="btn" href="' + run + '">Back to GitHub</a>';
        out.querySelector('p').textContent = (q.get('error_description') || err) + '. Start again from the workflow.';
      } else if (code) {
        out.innerHTML = '<h1>Approved ✓</h1><p>Copy this code, then on GitHub click <b>Run workflow</b>, paste it into the box and run. ' +
          'It works once and expires in a few minutes.</p><div class="code"></div>' +
          '<div class="row"><button class="btn" id="copy" type="button">Copy code</button>' +
          '<a class="btn btn-ghost" href="' + run + '" target="_blank" rel="noopener">Open GitHub</a></div>';
        out.querySelector('.code').textContent = code;
        document.getElementById('copy').onclick = function () {
          var b = this;
          navigator.clipboard.writeText(code).then(function () { b.textContent = 'Copied ✓'; });
        };
      }
    })();
  </script>
</body>
</html>
