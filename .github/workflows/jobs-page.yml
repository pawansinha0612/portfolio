# Rebuilds the public jobs page (pawansinha.com.au/jobs/) every morning from free job boards.
# Script: jobs/build.py. What it searches for: jobs/config.json.
# If every job board fails, the run goes red and the page keeps yesterday's list.
name: Jobs page

on:
  schedule:
    # 20:52 UTC = 7:52am Melbourne in summer (6:52am in winter). Off the hour and away from blog-publish (:07 / :37).
    - cron: '52 20 * * *'
  push:
    branches: [main]
    paths: ['jobs/**', '.github/workflows/jobs-page.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: jobs-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the jobs page
        run: python jobs/build.py

      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/jobs
          if git diff --cached --quiet; then
            echo 'No changes to the jobs page.'
            exit 0
          fi
          git commit -m "Jobs page: update $(TZ=Australia/Melbourne date +%Y-%m-%d)"
          # The blog workflow pushes to main too, so retry on a race.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 10
          done
          if [ -z "$pushed" ]; then
            echo '::error::Could not push the jobs page after 3 tries.'
            exit 1
          fi
          # Ask GitHub Pages to rebuild (pushes made by Actions don't always trigger it).
          curl -fsS -X POST -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo 'Pages build request failed; it will publish on the next build.'
